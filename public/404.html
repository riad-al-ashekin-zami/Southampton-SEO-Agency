<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found | Southampton SEO</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        background-color: #F9FAFB;
        color: #111827;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      header {
        padding: 24px;
        background: #ffffff;
        border-bottom: 1px solid #F3F4F6;
        display: flex;
        justify-content: space-between;
        align-items: center;
        max-width: 1200px;
        margin: 0 auto;
        width: 100%;
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
        color: #111827;
        font-weight: 800;
        font-size: 20px;
      }
      .logo-icon {
        width: 32px;
        height: 32px;
        background: #2563EB;
        color: #ffffff;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
      }
      main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 48px 24px;
        text-align: center;
      }
      .card {
        max-width: 440px;
        width: 100%;
      }
      .status-badge {
        display: inline-block;
        background: #F3F4F6;
        color: #4B5563;
        font-family: monospace;
        font-size: 12px;
        font-weight: 700;
        padding: 4px 12px;
        border-radius: 9999px;
        margin-bottom: 16px;
      }
      h1 {
        font-size: 32px;
        font-weight: 800;
        letter-spacing: -0.02em;
        margin-bottom: 12px;
        color: #111827;
      }
      p {
        font-size: 16px;
        color: #4B5563;
        line-height: 1.6;
        margin-bottom: 32px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        background: #2563EB;
        color: #ffffff;
        text-decoration: none;
        font-size: 14px;
        font-weight: 700;
        padding: 14px 28px;
        border-radius: 12px;
        transition: background 0.15s ease;
      }
      .btn:hover {
        background: #1D4ED8;
      }
      footer {
        padding: 24px;
        background: #ffffff;
        border-top: 1px solid #F3F4F6;
        text-align: center;
        font-size: 12px;
        color: #6B7280;
      }
    </style>
  </head>
  <body>
    <header>
      <a href="/" class="logo">
        <div class="logo-icon">S</div>
        <span>Southampton<span style="color: #2563EB;">SEO</span></span>
      </a>
      <a href="/" style="font-size: 13px; color: #4B5563; text-decoration: none; font-weight: 600;">← Back to Homepage</a>
    </header>

    <main>
      <div class="card">
        <div class="status-badge">HTTP 404</div>
        <h1>Page Not Found</h1>
        <p>The page you're looking for doesn't exist.</p>
        <a href="/" class="btn">Back to Southampton SEO</a>
      </div>
    </main>

    <footer>
      <p>© Southampton SEO. Specialist Search Engine Optimization Agency. Southampton & Hampshire, UK.</p>
    </footer>
  </body>
</html>
